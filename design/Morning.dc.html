<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Morning alarm</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#fff}
*{box-sizing:border-box}
.m{color:#4a4a4a}
.l{font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:700}
</style>
</helmet>
<div style="width:390px;height:844px;background:#fff;color:#000;font-family:'JetBrains Mono',monospace;padding:28px 22px;display:flex;flex-direction:column;gap:14px">
  <div style="display:flex;justify-content:space-between">
    <span class="l">Alarm</span>
    <span class="l m">Fri 23 Oct &#183; slept 7h 54m</span>
  </div>
  <div style="font-size:96px;font-weight:800;line-height:1;letter-spacing:-.04em">07:30</div>
  <div style="font-size:18px;font-weight:800;line-height:1.3">Photograph your desk setup to stop the alarm.</div>
  <div style="border:3px solid #000;height:300px;position:relative;background:#e4e4e4">
    <div style="position:absolute;left:12px;top:12px;width:28px;height:28px;border-left:5px solid #000;border-top:5px solid #000"></div>
    <div style="position:absolute;right:12px;top:12px;width:28px;height:28px;border-right:5px solid #000;border-top:5px solid #000"></div>
    <div style="position:absolute;left:12px;bottom:12px;width:28px;height:28px;border-left:5px solid #000;border-bottom:5px solid #000"></div>
    <div style="position:absolute;right:12px;bottom:12px;width:28px;height:28px;border-right:5px solid #000;border-bottom:5px solid #000"></div>
    <div class="l m" style="position:absolute;left:0;right:0;top:50%;text-align:center;transform:translateY(-50%)">Live camera view</div>
  </div>
  <div style="display:flex;gap:12px;align-items:stretch">
    <div style="width:92px;border:3px solid #000;padding:8px;font-size:11px;line-height:1.4"><span class="l">Last night</span><br>reference photo, 21:48</div>
    <div style="flex:1;border:3px solid #000;padding:8px 12px;font-size:13px;line-height:1.5"><span class="l">Match</span><br>Waiting for a match. Move closer to the desk.</div>
  </div>
  <div style="margin-top:auto">
    <a href="#" style="display:block;background:#000;color:#fff;text-align:center;padding:18px;font-weight:800;letter-spacing:.08em;text-decoration:none">TAKE PHOTO</a>
    <div class="m" style="font-size:12px;margin-top:10px;text-align:center">Fallback: 5 steps, 0 of 5 done. Social apps stay blocked until the ready photo.</div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
