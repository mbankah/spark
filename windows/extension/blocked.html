<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blocked by Spark</title>
<style>
  :root { --bg: #f4f6f8; --text: #0b0f14; --muted: #4a5560; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0b0f14; --text: #f4f6f8; --muted: #a8b3bd; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text); font-family: ui-monospace, Consolas, monospace; }
  main { max-width: 36rem; padding: 24px; border: 3px solid var(--text); margin: 16px; }
  h1 { font-size: 1.6rem; margin: 0 0 12px; }
  p { margin: 8px 0; line-height: 1.5; }
  .muted { color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>This site is blocked</h1>
  <p>Spark blocks it during a work block, the same as on your phone.</p>
  <p class="muted">There is nothing to type here. It opens again when the block ends. Passing the wall on your phone does not open it on this PC.</p>
</main>
</body>
</html>
